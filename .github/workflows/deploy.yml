name: Celuna CI/CD — Build & Deploy

on:
  push:
    branches:
      - main # Runs on every push to main
  pull_request:
    branches:
      - main # Runs checks on every pull request to main

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Test & Build
  # ─────────────────────────────────────────
  build:
    name: 🔨 Install, Test & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm" # Caches node_modules for faster runs

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci # Cleaner than npm install in CI

      # 4. Run tests (won't fail if no tests exist yet)
      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests

      # 5. Build the React app
      - name: Build
        run: npm run build

      # 6. Upload the build folder so the deploy job can use it
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: celuna-build
          path: build/
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 2: Deploy to Netlify
  # Only runs on push to main (not on PRs)
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Netlify
    runs-on: ubuntu-latest
    needs: build # Only runs if build job succeeds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # 1. Download the build artifact from job 1
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: celuna-build
          path: build/

      # 2. Deploy to Netlify
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./build"
          production-branch: main
          production-deploy: true
          deploy-message: "Deploy from GitHub Actions — ${{ github.event.head_commit.message }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
